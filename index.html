<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Styling App</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            cursor: none !important; 
        }

        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background-color: #0d0914; 
            color: #1a1a1a;
        }

        .stars, .twinkling {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%;
            display: block;
        }
        .stars {
            background: #000 url('https://www.transparenttextures.com/patterns/stardust.png') repeat top center;
            z-index: -2;
        }
        .twinkling {
            background: transparent url('https://www.transparenttextures.com/patterns/stardust.png') repeat top center;
            z-index: -1;
            animation: move-twink-back 200s linear infinite;
            opacity: 0.5;
        }
        @keyframes move-twink-back {
            from {background-position: 0 0;}
            to {background-position: -10000px 5000px;}
        }

        #custom-cursor {
            position: fixed;
            top: 0; left: 0;
            font-size: 28px; 
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: transform 0.05s linear;
            text-shadow: 0 0 10px rgba(255, 182, 193, 0.8);
        }
        .sparkle {
            position: fixed;
            width: 5px; height: 5px;
            background: #ffd1dc; 
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            box-shadow: 0 0 8px #ffb6c1;
            animation: fadeSparkle 0.6s forwards;
        }
        @keyframes fadeSparkle {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.1) translateY(15px); }
        }

        .app-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .panel {
            position: absolute;
            width: 90%;
            max-width: 420px;
            max-height: 90vh;
            background: linear-gradient(135deg, rgba(253, 233, 237, 0.9) 0%, rgba(243, 213, 222, 0.85) 100%);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.5);
            opacity: 0;
            transform: scale(0.95) translateY(20px);
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .panel.active {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }
        .panel.scrollable {
            overflow-y: auto;
            padding-right: 15px;
        }
        .panel.scrollable::-webkit-scrollbar { width: 5px; }
        .panel.scrollable::-webkit-scrollbar-thumb { background: #d4a5b4; border-radius: 10px; }

        .panel-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-section { text-align: center; margin-bottom: 25px; }
        .logo { width: 60px; border-radius: 50%; box-shadow: 0 5px 15px rgba(0,0,0,0.2); margin-bottom: 10px; }
        h1 { font-size: 24px; font-weight: 700; letter-spacing: 2px; line-height: 1.1; }
        h1 span { font-weight: 400; font-size: 16px; letter-spacing: 4px; }

        input[type="text"], input[type="email"], textarea {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.8);
            background: rgba(255,255,255,0.4);
            border-radius: 12px;
            font-size: 14px;
            color: #333;
            outline: none;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
            transition: 0.3s;
        }
        input:focus, textarea:focus { background: rgba(255,255,255,0.7); border-color: #d4a5b4; }

        .gdpr-box {
            background: rgba(255,255,255,0.3);
            padding: 15px;
            border-radius: 12px;
            font-size: 11px;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        .checkbox-wrapper, .cb-option {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            margin-bottom: 20px;
        }
        .cb-option {
            background: rgba(255,255,255,0.4);
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 8px;
            transition: 0.2s;
        }
        .cb-option:hover { background: rgba(255,255,255,0.7); }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #e6b8c4, #d4a5b4);
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(212, 165, 180, 0.4);
            transition: 0.3s;
        }
        .btn:hover { background: linear-gradient(90deg, #d4a5b4, #c293a2); transform: translateY(-2px); }
        .btn-outline {
            background: transparent;
            border: 2px solid #d4a5b4;
            color: #d4a5b4;
            box-shadow: none;
        }
        .btn-outline:hover { background: rgba(212, 165, 180, 0.1); }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }

        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 15px; }
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 25px; }
        .style-item { text-align: center; font-size: 11px; font-weight: 600; }
        .planet {
            width: 60px; height: 60px;
            border-radius: 50%;
            margin: 0 auto 8px auto;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.5), 0 5px 10px rgba(0,0,0,0.2);
            border: 2px solid transparent;
            transition: 0.3s;
        }
        .style-item.active .planet { border-color: #fff; transform: scale(1.1); box-shadow: 0 0 15px #d4a5b4; }

        .punk { background: linear-gradient(45deg, #2b2b2b, #ff4b4b); }
        .cyberpunk { background: linear-gradient(45deg, #000, #0ff, #f0f); }
        .rock { background: radial-gradient(circle, #555, #111); }
        .minimalist { background: radial-gradient(circle, #fff, #ddd); }
        .glamour { background: radial-gradient(circle, #ffd700, #ff8c00); }
        .boho { background: radial-gradient(circle, #d4a373, #8b5a2b); }
        .artdeco { background: repeating-linear-gradient(45deg, #000, #000 10px, #ffd700 10px, #ffd700 20px); }
        .dadaism { background: conic-gradient(#f00, #0f0, #00f, #ff0); }

        .traits-section { display: flex; gap: 15px; margin-bottom: 15px; }
        .trait-box {
            background: rgba(255,255,255,0.3);
            border-radius: 12px;
            padding: 10px;
            flex: 1;
            text-align: center;
        }
        .trait-box h4 { font-size: 11px; margin-bottom: 10px; opacity: 0.8; }
        .skin-grid { display: flex; justify-content: space-around; }
        .swatch { width: 25px; height: 25px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.1); }
        .gender-tags { display: flex; flex-direction: column; gap: 5px; }
        .gtag {
            background: rgba(255,255,255,0.5);
            font-size: 10px;
            padding: 4px 8px;
            border-radius: 4px;
            text-align: left;
            font-weight: 600;
        }

        .result-image-box {
            width: 100%;
            height: 250px;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .res-img { width: 100%; height: 100%; object-fit: cover; }
        .result-text p {
            background: rgba(255,255,255,0.4);
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .progress-container { margin-top: 15px; display: flex; align-items: center; gap: 10px;
</html>
