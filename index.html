<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura Profile – Personal Style & Wellness</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap');

  :root {
    --rose-gold: #B76E79;
    --rose-gold-light: #E8B4B8;
    --rose-gold-dark: #8B4A52;
    --cosmic: #0B0B1A;
    --card-bg: rgba(255,255,255,0.08);
    --text: #F8F1F1;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--cosmic);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Cosmic background */
  .stars {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
    z-index: -2;
  }
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle 4s infinite;
  }
  @keyframes twinkle {
    0%,100% { opacity: 0.3; }
    50% { opacity: 1; }
  }

  /* Header */
  header {
    text-align: center;
    padding: 2rem 1rem 1rem;
  }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.4rem;
    background: linear-gradient(135deg, #E8B4B8, #B76E79, #F5D0D3);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 1px;
  }
  header p { opacity: 0.7; margin-top: 0.4rem; font-size: 0.95rem; }

  /* Progress */
  .progress-bar {
    width: 90%;
    max-width: 480px;
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    margin: 1.5rem auto;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--rose-gold), var(--rose-gold-light));
    width: 0%;
    transition: width 0.4s ease;
  }
  .progress-text {
    text-align: center;
    font-size: 0.85rem;
    opacity: 0.8;
    margin-bottom: 1rem;
  }

  /* Main card */
  .card {
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(183,110,121,0.25);
    border-radius: 28px;
    padding: 2.2rem 1.8rem;
    max-width: 520px;
    margin: 0 auto 2rem;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    transition: all 0.4s ease;
  }

  .question-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.45rem;
    margin-bottom: 1.6rem;
    line-height: 1.35;
    text-align: center;
  }

  /* Bow-style buttons */
  .options {
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
  }
  .bow-btn {
    position: relative;
    background: linear-gradient(145deg, rgba(183,110,121,0.25), rgba(183,110,121,0.08));
    border: 1.5px solid var(--rose-gold);
    border-radius: 50px;
    padding: 1rem 1.4rem;
    color: white;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    text-align: left;
    overflow: hidden;
  }
  .bow-btn::before {
    content: '';
    position: absolute;
    top: -6px; left: 18px;
    width: 22px; height: 14px;
    background: linear-gradient(135deg, #E8B4B8, #B76E79);
    border-radius: 50% 50% 0 0;
    box-shadow: 14px 0 0 #B76E79;
    transform: rotate(-15deg);
    opacity: 0.9;
  }
  .bow-btn:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 12px 25px rgba(183,110,121,0.35);
    background: linear-gradient(145deg, rgba(183,110,121,0.4), rgba(183,110,121,0.15));
  }
  .bow-btn.selected {
    background: linear-gradient(145deg, var(--rose-gold), var(--rose-gold-dark));
    border-color: var(--rose-gold-light);
    box-shadow: 0 0 25px rgba(183,110,121,0.5);
  }
  .bow-btn.multi.selected::after {
    content: '✓';
    position: absolute;
    right: 18px;
    font-weight: 700;
  }

  /* Navigation */
  .nav {
    display: flex;
    justify-content: space-between;
    margin-top: 1.8rem;
    gap: 1rem;
  }
  .nav-btn {
    flex: 1;
    padding: 0.9rem;
    border-radius: 50px;
    border: none;
    font-weight: 600;
    cursor: pointer;
    transition: 0.25s;
  }
  .back-btn {
    background: transparent;
    border: 1.5px solid rgba(255,255,255,0.3) !important;
    color: white;
  }
  .back-btn:hover { background: rgba(255,255,255,0.08); }
  .next-btn {
    background: linear-gradient(135deg, var(--rose-gold), var(--rose-gold-dark));
    color: white;
  }
  .next-btn:hover { filter: brightness(1.15); }

  /* Constellation */
  .constellation {
    position: relative;
    width: 100%;
    height: 340px;
    margin: 1.5rem 0;
  }
  .trend-star {
    position: absolute;
    width: 70px; height: 70px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #F5D0D3, var(--rose-gold));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.72rem;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(183,110,121,0.6);
    transition: all 0.3s;
    border: 2px solid rgba(255,255,255,0.4);
  }
  .trend-star:hover, .trend-star.selected {
    transform: scale(1.18);
    box-shadow: 0 0 35px rgba(232,180,184,0.9);
  }
  .line {
    position: absolute;
    height: 1.5px;
    background: linear-gradient(90deg, transparent, rgba(183,110,121,0.5), transparent);
    transform-origin: left center;
  }

  /* Results */
  .result-section {
    display: none;
    max-width: 560px;
    margin: 0 auto 3rem;
  }
  .result-card {
    background: var(--card-bg);
    border: 1px solid rgba(183,110,121,0.3);
    border-radius: 24px;
    padding: 1.8rem;
    margin-bottom: 1.4rem;
  }
  .result-card h3 {
    font-family: 'Playfair Display', serif;
    color: var(--rose-gold-light);
    margin-bottom: 0.8rem;
  }
  .score-badge {
    display: inline-block;
    padding: 0.35rem 1rem;
    border-radius: 30px;
    font-weight: 600;
    font-size: 0.9rem;
    margin-top: 0.5rem;
  }
  .minimal { background: #2E7D32; }
  .mild { background: #F9A825; color: #111; }
  .moderate { background: #EF6C00; }
  .severe { background: #C62828; }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<header>
  <h1>Aura Profile</h1>
  <p>Descoperă stilul, starea & recomandările tale</p>
</header>

<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div class="progress-text" id="progressText">Întrebarea 1 din 30</div>

<!-- QUESTION CARD -->
<div class="card" id="questionCard">
  <div class="question-title" id="questionTitle"></div>
  <div class="options" id="optionsContainer"></div>
  <div class="nav">
    <button class="nav-btn back-btn" id="backBtn" onclick="prevQuestion()">← Înapoi</button>
    <button class="nav-btn next-btn" id="nextBtn" onclick="nextQuestion()">Continuă →</button>
  </div>
</div>

<!-- RESULTS -->
<div class="result-section" id="results">
  <div class="result-card">
    <h3>🧠 Anxietate (GAD-7)</h3>
    <p id="gadScore"></p>
    <div class="score-badge" id="gadBadge"></div>
  </div>
  <div class="result-card">
    <h3>💎 Stima de sine (RSES)</h3>
    <p id="rsesScore"></p>
  </div>
  <div class="result-card">
    <h3>🌸 Parfum recomandat</h3>
    <p id="perfumeRec"></p>
  </div>
  <div class="result-card">
    <h3>💐 Flori potrivite (pentru iubit / soț)</h3>
    <p id="flowerRec"></p>
  </div>
  <div class="result-card">
    <h3>✨ Stilul tău dominant</h3>
    <p id="styleRec"></p>
  </div>
</div>

<script>
// ========== DATA ==========
const questions = [
  // --- CONSTELAȚIE TRENDURI ---
  {
    id: 'trends',
    type: 'constellation',
    title: 'Alege stilurile care te reprezintă (poți selecta mai multe)',
    multi: true,
    options: ['Punk','Rock','Boho','Cyberpunk','Glamour','Minimalist','Rose Gold']
  },
  // --- BODY / METABOLISM / SKIN ---
  {
    id: 'body',
    title: 'Tipul tău de corp',
    multi: false,
    options: ['Clepsidră','Pară','Măr','Dreptunghi','Atletic']
  },
  {
    id: 'metabolism',
    title: 'Cum ți-ai descrie metabolismul?',
    multi: false,
    options: ['Foarte rapid','Rapid','Echilibrat','Lent','Foarte lent']
  },
  {
    id: 'skin',
    title: 'Tipul tău de ten',
    multi: false,
    options: ['Uscat','Mixt','Gras','Sensibil','Normal']
  },
  {
    id: 'undertone',
    title: 'Subtonul pielii',
    multi: false,
    options: ['Caldi (auriu)','Reci (roz)','Neutru','Măsliniu','Nu știu']
  },
  // --- GAD-7 (7 itemi reali) ---
  {
    id: 'gad1',
    title: 'În ultimele 2 săptămâni, cât de des te-ai simțit nervoasă, anxioasă sau tensionată?',
    multi: false,
    options: ['Deloc','Câteva zile','Mai mult de jumătate din zile','Aproape în fiecare zi'],
    scores: [0,1,2,3]
  },
  {
    id: 'gad2',
    title: 'Cât de des nu ai putut să oprești sau să controlezi îngrijorarea?',
    multi: false,
    options: ['Deloc','Câteva zile','Mai mult de jumătate din zile','Aproape în fiecare zi'],
    scores: [0,1,2,3]
  },
  {
    id: 'gad3',
    title: 'Cât de des te-ai îngrijorat prea mult din cauza unor lucruri diferite?',
    multi: false,
    options: ['Deloc','Câteva zile','Mai mult de jumătate din zile','Aproape în fiecare zi'],
    scores: [0,1,2,3]
  },
  {
    id: 'gad4',
    title: 'Cât de des ai avut probleme să te relaxezi?',
    multi: false,
    options: ['Deloc','Câteva zile','Mai mult de jumătate din zile','Aproape în fiecare zi'],
    scores: [0,1,2,3]
  },
  {
    id: 'gad5',
    title: 'Cât de des ai fost atât de agitată încât îți era greu să stai pe loc?',
    multi: false,
    options: ['Deloc','Câteva zile','Mai mult de jumătate din zile','Aproape în fiecare zi'],
    scores: [0,1,2,3]
  },
  {
    id: 'gad6',
    title: 'Cât de des te-ai enervat sau iritat ușor?',
    multi: false,
    options: ['Deloc','Câteva zile','Mai mult de jumătate din zile','Aproape în fiecare zi'],
    scores: [0,1,2,3]
  },
  {
    id: 'gad7',
    title: 'Cât de des ți-a fost teamă ca și cum s-ar putea întâmpla ceva groaznic?',
    multi: false,
    options: ['Deloc','Câteva zile','Mai mult de jumătate din zile','Aproape în fiecare zi'],
    scores: [0,1,2,3]
  },
  // --- RSES (10 itemi + reverse) ---
  {
    id: 'rses1',
    title: 'În general, sunt mulțumită de mine însămi.',
    multi: false,
    options: ['Dezacord total','Dezacord','Acord','Acord total'],
    scores: [0,1,2,3],
    reverse: false
  },
  {
    id: 'rses2',
    title: 'Uneori cred că nu sunt deloc bună.',
    multi: false,
    options: ['Dezacord total','Dezacord','Acord','Acord total'],
    scores: [0,1,2,3],
    reverse: true
  },
  {
    id: 'rses3',
    title: 'Simt că am o serie de calități bune.',
    multi: false,
    options: ['Dezacord total','Dezacord','Acord','Acord total'],
    scores: [0,1,2,3],
    reverse: false
  },
  {
    id: 'rses4',
    title: 'Sunt capabilă să fac lucruri la fel de bine ca majoritatea oamenilor.',
    multi: false,
    options: ['Dezacord total','Dezacord','Acord','Acord total'],
    scores: [0,1,2,3],
    reverse: false
  },
  {
    id: 'rses5',
    title: 'Simt că nu am prea multe de care să fiu mândră.',
    multi: false,
    options: ['Dezacord total','Dezacord','Acord','Acord total'],
    scores: [0,1,2,3],
    reverse: true
  },
  {
    id: 'rses6',
    title: 'Cu siguranță mă simt inutilă uneori.',
    multi: false,
    options: ['Dezacord total','Dezacord','Acord','Acord total'],
    scores: [0,1,2,3],
    reverse: true
  },
  {
    id: 'rses7',
    title: 'Simt că sunt o persoană de valoare, cel puțin pe același plan cu alții.',
    multi: false,
    options: ['Dezacord total','Dezacord','Acord','Acord total'],
    scores: [0,1,2,3],
    reverse: false
  },
  {
    id: 'rses8',
    title: 'Mi-aș dori să am mai mult respect pentru mine însămi.',
    multi: false,
    options: ['Dezacord total','Dezacord','Acord','Acord total'],
    scores: [0,1,2,3],
    reverse: true
  },
  {
    id: 'rses9',
    title: 'În general, sunt înclinată să cred că sunt un eșec.',
    multi: false,
    options: ['Dezacord total','Dezacord','Acord','Acord total'],
    scores: [0,1,2,3],
    reverse: true
  },
  {
    id: 'rses10',
    title: 'Am o atitudine pozitivă față de mine însămi.',
    multi: false,
    options: ['Dezacord total','Dezacord','Acord','Acord total'],
    scores: [0,1,2,3],
    reverse: false
  },
  // --- EXTRA STYLE / PERFUME / FLOWERS ---
  {
    id: 'perfumePref',
    title: 'Ce tip de parfum te atrage cel mai mult?',
    multi: true,
    options: ['Dulce & vanilat','Floral proaspăt','Elegant & sofisticat','Oriental intens','Proaspăt citric']
  },
  {
    id: 'flowerMood',
    title: 'Ce atmosferă îți place la flori?',
    multi: true,
    options: ['Exotice & tropicale','De câmp & sălbatice','Elegante & clasice','Romantice & delicate','Moderne & minimaliste']
  },
  {
    id: 'season',
    title: 'Anotimpul tău preferat',
    multi: false,
    options: ['Primăvara','Vara','Toamna','Iarna','Toate la fel']
  }
];

let current = 0;
let answers = {};
let selected = new Set();

// Create stars background
function createStars() {
  const container = document.getElementById('stars');
  for (let i = 0; i < 120; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.width = s.style.height = Math.random() * 2.5 + 'px';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = Math.random() * 5 + 's';
    container.appendChild(s);
  }
}
createStars();

function renderQuestion() {
  const q = questions[current];
  document.getElementById('questionTitle').textContent = q.title;
  document.getElementById('progressText').textContent = `Întrebarea ${current + 1} din ${questions.length}`;
  document.getElementById('progressFill').style.width = ((current + 1) / questions.length * 100) + '%';
  document.getElementById('backBtn').style.visibility = current === 0 ? 'hidden' : 'visible';

  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  selected = new Set(answers[q.id] || []);

  if (q.type === 'constellation') {
    renderConstellation(q, container);
  } else {
    q.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'bow-btn' + (q.multi ? ' multi' : '');
      btn.textContent = opt;
      if (selected.has(opt)) btn.classList.add('selected');
      btn.onclick = () => toggleOption(opt, q.multi, btn);
      container.appendChild(btn);
    });
  }

  // Auto-hide next if single select already chosen
  document.getElementById('nextBtn').style.display = q.multi || q.type === 'constellation' ? 'block' : 'none';
}

function toggleOption(opt, multi, btn) {
  if (multi) {
    if (selected.has(opt)) {
      selected.delete(opt);
      btn.classList.remove('selected');
    } else {
      if (selected.size >= 5) return; // max 5
      selected.add(opt);
      btn.classList.add('selected');
    }
  } else {
    // single → auto advance
    selected.clear();
    selected.add(opt);
    document.querySelectorAll('.bow-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    setTimeout(() => nextQuestion(), 380);
  }
}

function renderConstellation(q, container) {
  const wrap = document.createElement('div');
  wrap.className = 'constellation';
  const positions = [
    {x:20,y:30},{x:50,y:15},{x:80,y:35},{x:35,y:55},
    {x:65,y:60},{x:15,y:75},{x:75,y:80}
  ];
  q.options.forEach((opt, i) => {
    const star = document.createElement('div');
    star.className = 'trend-star' + (selected.has(opt) ? ' selected' : '');
    star.textContent = opt;
    star.style.left = positions[i].x + '%';
    star.style.top = positions[i].y + '%';
    star.onclick = () => {
      if (selected.has(opt)) {
        selected.delete(opt);
        star.classList.remove('selected');
      } else {
        if (selected.size >= 5) return;
        selected.add(opt);
        star.classList.add('selected');
      }
    };
    wrap.appendChild(star);
  });
  container.appendChild(wrap);
}

function nextQuestion() {
  const q = questions[current];
  answers[q.id] = Array.from(selected);
  if (current < questions.length - 1) {
    current++;
    renderQuestion();
  } else {
    showResults();
  }
}

function prevQuestion() {
  if (current > 0) {
    current--;
    renderQuestion();
  }
}

function showResults() {
  document.getElementById('questionCard').classList.add('hidden');
  document.querySelector('.progress-bar').classList.add('hidden');
  document.getElementById('progressText').classList.add('hidden');
  document.getElementById('results').style.display = 'block';

  // GAD-7
  let gad = 0;
  for (let i = 1; i <= 7; i++) {
    const ans = answers['gad' + i];
    if (ans && ans[0]) {
      const idx = questions.find(q => q.id === 'gad' + i).options.indexOf(ans[0]);
      gad += questions.find(q => q.id === 'gad' + i).scores[idx];
    }
  }
  let gadLevel, badgeClass;
  if (gad <= 4) { gadLevel = 'Minimă'; badgeClass = 'minimal'; }
  else if (gad <= 9) { gadLevel = 'Ușoară'; badgeClass = 'mild'; }
  else if (gad <= 14) { gadLevel = 'Moderată'; badgeClass = 'moderate'; }
  else { gadLevel = 'Severă'; badgeClass = 'severe'; }
  document.getElementById('gadScore').textContent = `Scor: ${gad}/21`;
  const badge = document.getElementById('gadBadge');
  badge.textContent = gadLevel;
  badge.className = 'score-badge ' + badgeClass;

  // RSES
  let rses = 0;
  for (let i = 1; i <= 10; i++) {
    const q = questions.find(qq => qq.id === 'rses' + i);
    const ans = answers['rses' + i];
    if (ans && ans[0]) {
      let idx = q.options.indexOf(ans[0]);
      let score = q.scores[idx];
      if (q.reverse) score = 3 - score;
      rses += score;
    }
  }
  document.getElementById('rsesScore').textContent = `Scor: ${rses}/30 — ${rses >= 15 ? 'Stima de sine normală / ridicată' : 'Stima de sine scăzută'}`;

  // Perfume
  const perf = answers.perfumePref || [];
  let perfumeText = 'Parfum floral elegant cu note soft';
  if (perf.includes('Dulce & vanilat')) perfumeText = 'Parfum dulce, vanilat, gourmand – cald și seducător';
  else if (perf.includes('Floral proaspăt')) perfumeText = 'Parfum floral proaspăt, aerisit, cu note de trandafir și peonie';
  else if (perf.includes('Elegant & sofisticat')) perfumeText = 'Parfum elegant, sofistificat, cu note lemnoase și pudrate';
  else if (perf.includes('Oriental intens')) perfumeText = 'Parfum oriental intens, cu ambră și condimente';
  else if (perf.includes('Proaspăt citric')) perfumeText = 'Parfum proaspăt citric, energizant și luminos';
  document.getElementById('perfumeRec').textContent = perfumeText;

  // Flowers
  const flowers = answers.flowerMood || [];
  let flowerText = 'Buchet mixt de flori de câmp și trandafiri pastel';
  if (flowers.includes('Exotice & tropicale')) flowerText = 'Orhidee, strelitzia, protea și flori tropicale exotice';
  else if (flowers.includes('De câmp & sălbatice')) flowerText = 'Flori de câmp, lavandă, mușețel, eucalipt și graminee';
  else if (flowers.includes('Elegante & clasice')) flowerText = 'Trandafiri albi/crem, crini, hortensii elegante';
  else if (flowers.includes('Romantice & delicate')) flowerText = 'Pioni, ranunculus, eustoma și trandafiri roz';
  else if (flowers.includes('Moderne & minimaliste')) flowerText = 'Flori monocromatice, aranjamente curate, eucalipt + 1-2 specii';
  document.getElementById('flowerRec').textContent = flowerText;

  // Style
  const trends = answers.trends || [];
  document.getElementById('styleRec').textContent = trends.length
    ? 'Stil dominant: ' + trends.join(', ')
    : 'Stil echilibrat, versatil';
}

// Start
renderQuestion();
</script>
</body>
</html>
